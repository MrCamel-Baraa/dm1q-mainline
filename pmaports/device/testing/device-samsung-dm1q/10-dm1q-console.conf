# Console loglevel once userspace is up (docs/09 section 16.1).
# The kernel cmdline keeps loglevel=7 on purpose, so the early boot log is visible on the panel.
# Without this, the late kernel lines (WLAN association, deferred probes, "Not disabling unused
# regulators", ~8-32 s) are printed over the login prompt. Fields: console_loglevel,
# default_message_loglevel, minimum_console_loglevel, default_console_loglevel.
# dmesg still has every message; only what is echoed to tty0 changes.
kernel.printk = 4 4 1 7
