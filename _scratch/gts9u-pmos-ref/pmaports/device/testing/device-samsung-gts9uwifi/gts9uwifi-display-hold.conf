# SM-X910 mainline bring-up: keep the bootloader display pipeline alive.
#
# The v0 DTS has no native DRM/DSI driver; the panel is scanned out by the
# hardware pipeline the bootloader left running and simpledrm only writes
# pixels into that framebuffer.  The penguins freeze because something after
# ~18 s tears that pipeline down; the panel is the last frame in its GRAM.
#
# Two families of late-loading modules are held off, in order of suspicion:
#
# 1. TrustZone/SCM callers (qcomtee, qcom_ice).  On this Samsung XBL the
#    splash is owned by TZ; the qcom-ice and qcomtee probes both issue SCM
#    calls at ~18.6 s, exactly when v0.21 (console=tty0) froze the panel, and
#    neither loaded in the v0.11-v0.18 "-dirty" builds that showed the greeter.
#    Our root is the microSD (sdhc_2, 8804000.mmc); the 1d88000 ICE belongs to
#    the internal UFS we never touch, so blocking it is safe for boot.
#
# 2. Multimedia clock controllers (dispcc/videocc/camcc/gpucc).  Loading them
#    completes qcom-rpmhpd's DT consumer list, so rpmhpd sync_state() drops the
#    boot MMCX vote.  v0.28 proved this alone does NOT unfreeze the panel, but
#    they stay blocked because they have no use before the native msm stack.
#
# Blacklisting only blocks udev/modalias autoload; the modules stay available
# and this file must be deleted when the real msm/DSI display stack is
# brought up.
blacklist qcomtee
blacklist qcom_ice
blacklist dispcc_sm8550
blacklist videocc_sm8550
blacklist camcc_sm8550
blacklist gpucc_sm8550
