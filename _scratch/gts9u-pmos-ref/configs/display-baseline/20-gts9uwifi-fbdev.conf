# Reverse PRIME: Adreno card0 owns the accelerated X screen while the separate
# DPU card1 provider scans its linear dma-bufs out to the native DSI panel.
Section "ServerLayout"
	Identifier "SM-X910 reverse PRIME layout"
	Screen 0 "SM-X910 accelerated screen"
EndSection

Section "Device"
	Identifier "SM-X910 Adreno primary"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
	Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Device"
	Identifier "SM-X910 DPU output"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card1"
	Option "AccelMethod" "none"
EndSection

Section "Screen"
	Identifier "SM-X910 accelerated screen"
	Device "SM-X910 Adreno primary"
	GPUDevice "SM-X910 DPU output"
	DefaultDepth 24
	DefaultFbBpp 32
	SubSection "Display"
		Depth 24
		Virtual 2960 1848
	EndSubSection
EndSection

# The current command-mode panel driver does not yet resume reliably after
# Xorg powers the OLED down. Keep it lit until panel suspend/resume is fixed.
Section "ServerFlags"
	Option "Debug" "dmabuf_capable,force_linear_dri3"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection
