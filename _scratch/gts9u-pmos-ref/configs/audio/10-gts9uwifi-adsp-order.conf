# pd-mapper resolves the protection domains ("avs/audio" -> "msm/adsp/audio_pd")
# that the q6apm/q6prm DT nodes wait on, and it discovers its *.jsn maps by
# reading /sys/class/remoteproc/*/firmware and scanning that firmware's own
# directory.  Both facts require the ADSP remoteproc to be up first: this port
# boots it late, from gts9uwifi-adsp-boot.service, because auto_boot fires long
# before the microSD rootfs that carries the firmware is mounted.  Without this
# ordering pd-mapper starts too early, finds no remoteproc, exits with
# "no pd maps available", and systemd gives up after the start-limit.
[Unit]
After=gts9uwifi-adsp-boot.service
Wants=gts9uwifi-adsp-boot.service

[Service]
Restart=on-failure
RestartSec=3
